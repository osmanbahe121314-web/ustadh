<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>GTA أم درمان - الخريطة الرهيبة</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{overflow:hidden;background:#000;font-family:Tahoma}
canvas{display:block}
#hud{position:absolute;top:0;left:0;right:0;background:rgba(0,0,0,0.85);color:#fff;padding:7px;display:flex;justify-content:space-between;font-size:11px;z-index:10;border-bottom:2px solid #22c55e}
#msg{position:absolute;top:46px;left:50%;transform:translateX(-50%);background:#fbbf24;color:#000;padding:8px 16px;border-radius:22px;font-weight:bold;font-size:12px;z-index:10;text-align:center}
#ctrl{position:absolute;bottom:12px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:10}
.joy{width:115px;height:115px;background:rgba(255,255,255,0.15);border-radius:50%;border:2px solid rgba(255,255,255,0.4);position:relative}
.stick{width:48px;height:48px;background:#22c55e;border-radius:50%;position:absolute;top:33px;left:33px;box-shadow:0 0 12px #22c55e}
.btn{width:64px;height:54px;border-radius:14px;border:0;background:#22c55e;font-size:22px;margin-left:6px}
</style>
</head>
<body>
<div id="hud"><div>🕌 سليمان | علم: <span id="ilm">0</span>% | أتباع: <span id="fol">0</span></div><div id="car">🚶 ماشي</div><div id="spd">0 km/h</div></div>
<div id="msg">المسجد الكبير في النص - سوق ليه 📖</div>
<canvas id="game"></canvas>
<div id="ctrl"><div style="display:flex"><button class="btn" id="act">📢</button><button class="btn" id="enter">🚗</button></div><div class="joy" id="joy"><div class="stick" id="stick"></div></div></div>
<img id="mapImg" src="map.webp" style="display:none">
<script>
const gc=document.getElementById('game'),g=gc.getContext('2d');
const mapImg=document.getElementById('mapImg');
function rs(){gc.width=innerWidth;gc.height=innerHeight;}rs();onresize=rs;
let P={x:1000,y:1000,car:null,walk:true},cars=[{x:1150,y:1050,w:75,h:34,col:'#3b82f6',a:0,s:0,occ:false,n:'دعوة'},{x:800,y:600,w:75,h:34,col:'#ef4444',a:0,s:0,occ:false,n:'خمور'}];
let D=[{x:1000,y:1000,d:false},{x:1000,y:700,d:false},{x:1400,y:700,d:false},{x:600,y:1000,d:false},{x:1000,y:1400,d:false}];
let ilm=0,fol=0,joy={x:0,y:0},K={},worldW=2000,worldH=2000;
function draw(){
let cx=gc.width/2,cy=gc.height/2;
let sx=(P.x/worldW)*1000, sy=(P.y/worldH)*1000;
let zoom=0.32, sw=gc.width*zoom, sh=gc.height*zoom;
if(mapImg.complete && mapImg.naturalWidth>0){
g.drawImage(mapImg, sx-sw/2, sy-sh/2, sw, sh, 0,0,gc.width,gc.height);
}else{
g.fillStyle='#1a2e1a';g.fillRect(0,0,gc.width,gc.height);
g.fillStyle='#fff';g.font='14px';g.fillText('جاري تحميل الخريطة... تأكد أن map.webp في نفس المجلد',20,50);
}
D.forEach(p=>{if(!p.d){
let px=p.x/worldW*1000, py=p.y/worldH*1000;
if(Math.abs(px-sx)<sw/2){
let dx=(px-(sx-sw/2))/sw*gc.width, dy=(py-(sy-sh/2))/sh*gc.height;
g.fillStyle='#fbbf24';g.shadowColor='#fbbf24';g.shadowBlur=20;g.beginPath();g.arc(dx,dy,16,0,Math.PI*2);g.fill();g.shadowBlur=0;
g.fillStyle='#000';g.font='bold 13px';g.fillText('📖',dx-8,dy+4);
}}});
cars.forEach(car=>{
let cpx=car.x/worldW*1000, cpy=car.y/worldH*1000;
if(Math.abs(cpx-sx)<sw/2){
let dx=(cpx-(sx-sw/2))/sw*gc.width, dy=(cpy-(sy-sh/2))/sh*gc.height;
g.save();g.translate(dx,dy);g.rotate(car.a);
g.fillStyle=car.col;g.beginPath();g.roundRect(-car.w/2,-car.h/2,car.w,car.h,7);g.fill();
g.fillStyle='#111';g.fillRect(-car.w/2+10,-car.h/2+6,18,10);g.fillRect(car.w/2-28,-car.h/2+6,18,10);
g.restore();
}});
if(P.walk){g.fillStyle='#22c55e';g.beginPath();g.arc(cx,cy,14,0,Math.PI*2);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();g.font='18px Tahoma';g.fillText('👳🏽',cx-9,cy+6);}
}
function upd(){
let mx=0,my=0;if(K['w']||joy.y<-0.2)my=-1;if(K['s']||joy.y>0.2)my=1;if(K['a']||joy.x<-0.2)mx=-1;if(K['d']||joy.x>0.2)mx=1;
if(P.walk){P.x+=mx*6;P.y+=my*6;}else{let c=P.car;c.s+=my*0.2;c.s*=0.95;c.a+=mx*0.06*c.s;c.x+=Math.cos(c.a)*c.s*7;c.y+=Math.sin(c.a)*c.s*7;P.x=c.x;P.y=c.y;document.getElementById('spd').innerText=Math.floor(Math.abs(c.s)*45)+' km/h';}
P.x=Math.max(0,Math.min(worldW,P.x));P.y=Math.max(0,Math.min(worldH,P.y));
D.forEach(p=>{if(!p.d&&Math.hypot(P.x-p.x,P.y-p.y)<70){p.d=true;ilm+=15;fol+=90;document.getElementById('msg').innerText='✅ باقي '+(D.filter(x=>!x.d).length)+' نقاط';if(D.every(x=>x.d)){document.getElementById('msg').innerText='🎉 حررت أم درمان! المذيعات متحجبات بفرح!';setTimeout(()=>alert('الله أكبر! المسجد الكبير اتملى - لا إله إلا الله محمد رسول الله ﷺ'),500);}}});
document.getElementById('ilm').innerText=ilm;document.getElementById('fol').innerText=fol;
}
function loop(){upd();draw();requestAnimationFrame(loop);}loop();
addEventListener('keydown',e=>K[e.key]=true);addEventListener('keyup',e=>K[e.key]=false);
let je=document.getElementById('joy'),st=document.getElementById('stick');
je.addEventListener('touchmove',e=>{
let r=je.getBoundingClientRect();let tx=e.touches[0].clientX-r.left-57,ty=e.touches[0].clientY-r.top-57;
let d=Math.min(42,Math.hypot(tx,ty)),a=Math.atan2(ty,tx);joy.x=Math.cos(a)*d/42;joy.y=Math.sin(a)*d/42;st.style.left=33+Math.cos(a)*d+'px';st.style.top=33+Math.sin(a)*d+'px';e.preventDefault();
},{passive:false});
je.addEventListener('touchend',()=>{joy.x=0;joy.y=0;st.style.left='33px';st.style.top='33px';});
document.getElementById('enter').onclick=()=>{
if(P.walk){let n=cars.find(c=>Math.hypot(P.x-c.x,P.y-c.y)<85);if(n){P.walk=false;P.car=n;n.occ=true;document.getElementById('car').innerText='🚗 '+n.n;}}
else{P.walk=true;P.car.occ=false;P.car.s=0;P.car=null;document.getElementById('car').innerText='🚶 ماشي';}
};
document.getElementById('act').onclick=()=>{
if(!P.walk&&P.car.n=='خمور'){P.car.col='#1e293b';P.car.n='مقفول';fol+=150;document.getElementById('msg').innerText='🚫 قفلت الخمارة!';}
};
mapImg.onload=()=>{draw();};
</script>
</body>
</html>
